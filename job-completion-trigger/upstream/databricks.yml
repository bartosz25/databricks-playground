bundle:
  name: job_completion_trigger_upstream

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

targets:
  dev:
    # production mode keeps the triggers unpaused and the job names without the [dev <user>] prefix,
    # so that the downstream bundle can resolve them with the lookup variables
    mode: production
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
      host: https://dbc-d4ba7c54-6fba.cloud.databricks.com
