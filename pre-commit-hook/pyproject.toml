[project]
name = "pre_commit_hook"
version = "0.0.1"
authors = [{ name = "contact@waitingforcode.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    # Any dependencies for jobs and pipelines in this project can be added here
    # See also https://docs.databricks.com/dev-tools/bundles/library-dependencies
    #
    # LIMITATION: for pipelines, dependencies are cached during development;
    # add dependencies to the 'environment' section of your pipeline.yml file instead
]

[dependency-groups]
dev = [
    "poethepoet==0.40.0",
    "pre-commit==4.5.1"
]

[project.scripts]
main = "poe_demo.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 125


[tool.poe.tasks.validate_dab]
help ="Validates Databricks Asset Bundle, including warnings detection."
shell = """
    bundle_outcome=$(databricks bundle validate -t dev  --profile personal_free_edition)
    echo $bundle_outcome | grep 'warning' &> /dev/null
    if [ $? == 0 ]; then
      echo "❗ A warning detected in the bundle: ";
      echo $bundle_outcome;
      exit 1
    else
      echo "✅ Bundle is valid"
    fi
"""
interpreter = 'bash'



[tool.poe.tasks.build]
help = "Builds the wheel"
shell = """
    rm -rf ./dist
    uv build --sdist --wheel
"""