bundle:
  name: job_completion_trigger_downstream

include:
  - resources/*.yml

variables:
  workspace_id:
    description: Id of the workspace hosting the upstream jobs, returned by `databricks metastores current`
    default: ""
  # The upstream jobs are defined in the upstream bundle; their ids are resolved by name at deployment time
  s2_upstream_job_id:
    lookup:
      job: s2_upstream
  s3_upstream_orders_job_id:
    lookup:
      job: s3_upstream_orders
  s3_upstream_customers_job_id:
    lookup:
      job: s3_upstream_customers
  s4_upstream_orders_job_id:
    lookup:
      job: s4_upstream_orders
  s4_upstream_customers_job_id:
    lookup:
      job: s4_upstream_customers
  s5_upstream_orders_job_id:
    lookup:
      job: s5_upstream_orders
  s5_upstream_customers_job_id:
    lookup:
      job: s5_upstream_customers

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

targets:
  dev:
    mode: production
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
      host: https://dbc-d4ba7c54-6fba.cloud.databricks.com
