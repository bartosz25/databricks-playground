resources:
  jobs:
    manifest_generator:
      name: manifest_generator
      max_concurrent_runs: 1
      queue:
        enabled: true
      trigger:
        file_arrival:
          url: "/Volumes/workspace/file_name_demo/to_process/raw_manifest/"
          wait_after_last_change_seconds: 60
      tasks:
        - task_key: generate
          environment_key: default
          python_wheel_task:
            package_name: file_name_demo
            entry_point: manifest_generator
            named_parameters:
              volume_path: "{{job.trigger.file_arrival.location}}"
              checkpoint_path: "/Volumes/workspace/file_name_demo/to_process/checkpoints/manifest_generator/"
              manifest_path: "/Volumes/workspace/file_name_demo/to_process/manifest/manifest_{{job.trigger.time.timestamp_ms}}"
      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - ../dist/*.whl
