resources:
  jobs:
    s5_upstream_customers:
      name: s5_upstream_customers
      max_concurrent_runs: 1
      queue:
        enabled: true
      tasks:
        - task_key: upstream_job
          environment_key: default
          python_wheel_task:
            package_name: upstream_jobs
            entry_point: upstream_job
            named_parameters:
              should_fail: "false"
      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - ../dist/*.whl
