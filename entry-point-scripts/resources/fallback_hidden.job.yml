resources:
  jobs:
    fallback_hidden:
      name: fallback_hidden
      max_concurrent_runs: 1
      queue:
        enabled: true
      tasks:
        - task_key: fallback_hidden
          environment_key: default
          python_wheel_task:
            package_name: entry_point_scripts
            entry_point: main_hidden
      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - ../dist/*.whl
