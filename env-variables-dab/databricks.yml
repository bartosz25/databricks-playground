# This is a Databricks asset bundle definition for env_variables_dab.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: env_variables_dab
  uuid: 5b0eb41b-f1bd-4add-9bc6-2591e3b645bf

include:
  - resources/*.yml

variables:
  volume_for_data:
    default: /Volumes/wfc/default
  items_catalog_path:
    default: ${var.volume_for_data}/items/
  orders_path:
    default: ${var.volume_for_data}/orders/
  warehouse_id_sql_queries:
    lookup:
      warehouse: "Serverless Starter Warehouse"
  failure_extra_users:
    type: complex
    default:
        - contact@waitingforcode.com
  a_variable:
      description: Something coming from the env.



artifacts:
  python_artifact:
    type: whl
    build: uv build --sdist --wheel


targets:
  dev:
    mode: development
    default: true
    workspace:
      host: YOUR ID
    variables:
      failure_extra_users:
        - contact+1@waitingforcode.com
        - contact+DE@waitingforcode.com
