resources:
  jobs:
    sample_job_triggered:
      name: sample_job_triggered
      tasks:
        - task_key: python_wheel_task
          python_wheel_task:
            package_name: repair_backfill
            entry_point: main
            named_parameters:
              execution_time: "{{ job.trigger.time.iso_date }}"
              backfill_time: "empty on purpose"
          environment_key: default
        - task_key: python_wheel_task_2
          depends_on:
            - task_key: python_wheel_task
          python_wheel_task:
            package_name: repair_backfill
            #entry_point: main
            entry_point: failing_main
            named_parameters:
              execution_time: "{{ job.trigger.time.iso_date }}"
              backfill_time: "empty on purpose"
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl