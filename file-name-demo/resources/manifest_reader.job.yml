resources:
  jobs:
    manifest_reader:
      name: manifest_reader
      max_concurrent_runs: 1
      queue:
        enabled: true
      trigger:
        file_arrival:
          url: "/Volumes/workspace/file_name_demo/to_process/manifest/"
          wait_after_last_change_seconds: 60
      tasks:
        - task_key: read
          environment_key: default
          python_wheel_task:
            package_name: file_name_demo
            entry_point: manifest_reader
            named_parameters:
              volume_path: "{{job.trigger.file_arrival.location}}"
              checkpoint_path: "/Volumes/workspace/file_name_demo/to_process/checkpoints/manifest_reader/"
      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - ../dist/*.whl
