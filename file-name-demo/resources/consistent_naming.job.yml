resources:
  jobs:
    consistent_naming:
      name: consistent_naming
      max_concurrent_runs: 1
      queue:
        enabled: true
      trigger:
        file_arrival:
          url: "/Volumes/workspace/file_name_demo/to_process/raw_naming/"
          wait_after_last_change_seconds: 60
      tasks:
        - task_key: read
          environment_key: default
          python_wheel_task:
            package_name: file_name_demo
            entry_point: consistent_naming
            named_parameters:
              volume_path: "{{job.trigger.file_arrival.location}}"
              trigger_date: "{{job.trigger.time.iso_date}}"
      environments:
        - environment_key: default
          spec:
            environment_version: "6"
            dependencies:
              - ../dist/*.whl
