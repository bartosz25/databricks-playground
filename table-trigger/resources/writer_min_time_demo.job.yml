resources:
  jobs:
    writer_min_time_demo:
      name: writer_min_time_demo
      max_concurrent_runs: 1
      queue:
        enabled: true
      tasks:
        - task_key: write_data
          environment_key: default
          python_wheel_task:
            package_name: table_trigger
            entry_point: writer_min_time_demo
      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - ../dist/*.whl
