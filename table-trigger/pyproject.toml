[project]
name = "table_trigger"
version = "0.0.1"
authors = [{ name = "contact@waitingforcode.com" }]
requires-python = ">=3.12,<=3.14"
dependencies = [
    # Any dependencies for jobs and pipelines in this project can be added here
    # See also https://docs.databricks.com/dev-tools/bundles/library-dependencies
    #
    # LIMITATION: for pipelines, dependencies are cached during development;
    # add dependencies to the 'environment' section of your pipeline.yml file instead
]

[dependency-groups]
dev = [
    "pyspark==4.2.0"
]

[project.scripts]
read_tables = "table_trigger.reader:read_tables"
writer_wait_demo = "table_trigger.writer_wait_demo:write_data"
writer_min_time_demo = "table_trigger.writer_min_time_demo:write_data"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
