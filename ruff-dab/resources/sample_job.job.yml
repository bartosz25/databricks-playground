resources:
  jobs:
    sample_job:
      name: sample_job
      tasks:
        - task_key: python_wheel_task
          python_wheel_task:
            package_name: ruff_dab
            entry_point: main
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl