resources:
  jobs:
    view_all_updated_trigger:
      name: view_all_updated_trigger
      max_concurrent_runs: 1
      queue:
        enabled: true
      trigger:
        table_update:
          table_names:
            - ${var.catalog}.${var.schema}.v_view_src
            - ${var.catalog}.${var.schema}.v_view_src_all
          condition: ALL_UPDATED
      tasks:
        - task_key: consume
          environment_key: default
          python_wheel_task:
            package_name: table_trigger
            entry_point: read_tables
            named_parameters:
              scenario: view_all_updated_trigger
              trigger_time: "{{job.trigger.time.iso_datetime}}"
              updated_tables: "{{job.trigger.table_update.updated_tables}}"
      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - ../dist/*.whl
