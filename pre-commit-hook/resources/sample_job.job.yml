resources:
  jobs:
    sample_job:
      name: sample_job
      tasks:
        - task_key: python_wheel_task
          depends_on:
            - not_existing_task
          python_wheel_task:
            package_name: pre_commit_hook
            entry_point: main
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl