resources:
  jobs:
    wait_after_last_change:
      name: wait_after_last_change
      max_concurrent_runs: 1
      queue:
        enabled: true
      trigger:
        table_update:
          table_names:
            - ${var.catalog}.${var.schema}.wait_after_last_change_seconds_src
          wait_after_last_change_seconds: 60
      tasks:
        - task_key: consume
          environment_key: default
          python_wheel_task:
            package_name: table_trigger
            entry_point: read_tables
            named_parameters:
              scenario: wait_after_last_change
              trigger_time: "{{job.trigger.time.iso_datetime}}"
              updated_tables: "{{job.trigger.table_update.updated_tables}}"
      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - ../dist/*.whl
