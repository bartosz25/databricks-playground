resources:
  jobs:
    autoloader:
      name: autoloader
      max_concurrent_runs: 1
      queue:
        enabled: true
      trigger:
        file_arrival:
          url: "/Volumes/workspace/file_name_demo/to_process/autoloader/"
          wait_after_last_change_seconds: 60
      tasks:
        - task_key: read
          environment_key: default
          python_wheel_task:
            package_name: file_name_demo
            entry_point: autoloader
            named_parameters:
              volume_path: "/Volumes/workspace/file_name_demo/to_process/autoloader/"
              checkpoint_path: "/Volumes/workspace/file_name_demo/to_process/checkpoints/autoloader/"
      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - ../dist/*.whl
