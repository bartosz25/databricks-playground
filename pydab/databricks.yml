bundle:
  name: pydabs_demo

python:
  venv_path: .venv
  # Functions called to load resources defined in Python
  resources:
    - "resources:load_resources"
    - "resources.bronze_to_silver:load_resources"
  # Functions called to modify every resource, the YAML ones included
  mutators:
    - "mutators:add_demo_tags"

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog that holds the demo schema
    default: workspace
  schema:
    description: Schema created by the setup script
    default: pydabs_demo

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: [YOUR HOST]
